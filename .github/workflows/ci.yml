---
name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            fonts-gfs-didot \
            latexmk \
            tex-fmt \
            texlive-latex-extra \
            texlive-luatex
          pipx install mbake

      - name: Install StyLua
        uses: JohnnyMorganz/stylua-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: false

      - name: Build
        run: make check
